---
- name: Prepare Helvilette Nodes
  hosts: all
  become: yes
  tasks:
    - name: Install dependencies (Go, Git, Make)
      apt:
        name:
          - golang-go
          - git
          - make
        state: present
        update_cache: yes

    - name: Ensure bin directory exists
      file:
        path: /vagrant/bin
        state: directory
        mode: '0700'
      become: false

    - name: Build Helvilette binaries
      command: make build
      args:
        chdir: /vagrant
        creates: /vagrant/bin/othela
      become: false

- name: Setup Othela Node
  hosts: othela
  become: yes
  tasks:
    - name: Create Othela user
      user:
        name: helvilette
        system: yes

    - name: Create data directories
      file:
        path: "{{ item }}"
        state: directory
        owner: helvilette
        group: helvilette
        mode: '0700'
      loop:
        - /var/lib/helvilette/othela
        - /var/lib/helvilette/playbooks

    - name: Create Othela systemd service
      copy:
        dest: /etc/systemd/system/othela.service
        content: |
          [Unit]
          Description=Helvilette Othela Server
          After=network.target

          [Service]
          Type=simple
          User=helvilette
          ExecStart=/vagrant/bin/othela --port=8080 --state-dir=/var/lib/helvilette/othela --playbook-dir=/var/lib/helvilette/playbooks
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Othela
      systemd:
        name: othela
        enabled: yes
        state: started
        daemon_reload: yes

- name: Setup Agent Node
  hosts: agents
  become: yes
  tasks:
    - name: Install Ansible (required by agent)
      apt:
        name: ansible
        state: present
        update_cache: yes

    - name: Create Agent systemd service
      copy:
        dest: /etc/systemd/system/helvi-agent.service
        content: |
          [Unit]
          Description=Helvilette Agent
          After=network.target

          [Service]
          Type=simple
          # Running as root since the agent modifies system state via ansible
          ExecStart=/vagrant/bin/agent --othela-url=http://192.168.121.10:8080/api/v1 --node-id={{ ansible_hostname }} --poll-interval=5s
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Agent
      systemd:
        name: helvi-agent
        enabled: yes
        state: started
        daemon_reload: yes
