version: '3.8'

services:
  othela:
    build:
      context: .
      dockerfile: Dockerfile.othela
    image: helvilette-othela:local
    ports:
      - "8080:8080"
    volumes:
      - ./data/othela:/data
    networks:
      - helvilette-net
    restart: unless-stopped

  node-1:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: helvilette-agent:local
    environment:
      - OTHELA_URL=http://othela:8080
      - NODE_ID=agent-01
    volumes:
      - ./data/agent-1:/tmp/helvilette
    networks:
      - helvilette-net
    depends_on:
      - othela
    restart: unless-stopped

  node-2:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: helvilette-agent:local
    environment:
      - OTHELA_URL=http://othela:8080
      - NODE_ID=agent-02
    volumes:
      - ./data/agent-2:/tmp/helvilette
    networks:
      - helvilette-net
    depends_on:
      - othela
    restart: unless-stopped

  node-3:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: helvilette-agent:local
    environment:
      - OTHELA_URL=http://othela:8080
      - NODE_ID=agent-03
    volumes:
      - ./data/agent-3:/tmp/helvilette
    networks:
      - helvilette-net
    depends_on:
      - othela
    restart: unless-stopped

networks:
  helvilette-net:
    driver: bridge