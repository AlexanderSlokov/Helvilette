services:
  othela:
    build:
      context: .
      dockerfile: Dockerfile.othela
    image: helvilette-othela:local
    ports:
      - "8080:8080"
    volumes:
      - ./tests/e2e/data:/app/helvillette/othela/data
    networks:
      - helvilette-net
    command: ["./othela", "--port=8080", "--data-dir=helvillette/othela/data/playbooks", "--log-level=info"]
    restart: unless-stopped
    depends_on:
      - git-server

  node-1:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: helvilette-agent:local
    command: ["./agent", "--config=/var/lib/helvilette/agent.yaml"]
    volumes:
      - ./data/agent-1:/tmp/helvilette
      - ./data/configs/agent-01.yaml:/var/lib/helvilette/agent.yaml
      - ./tests/e2e/data:/app/helvillette/othela/data
    networks:
      - helvilette-net
    depends_on:
      - othela
      - git-server
    restart: unless-stopped

  node-2:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: helvilette-agent:local
    command: ["./agent", "--config=/var/lib/helvilette/agent.yaml"]
    volumes:
      - ./data/agent-2:/tmp/helvilette
      - ./data/configs/agent-02.yaml:/var/lib/helvilette/agent.yaml
      - ./tests/e2e/data:/app/helvillette/othela/data
    networks:
      - helvilette-net
    depends_on:
      - othela
      - git-server
    restart: unless-stopped

  node-3:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: helvilette-agent:local
    command: ["./agent", "--config=/var/lib/helvilette/agent.yaml"]
    volumes:
      - ./data/agent-3:/tmp/helvilette
      - ./data/configs/agent-03.yaml:/var/lib/helvilette/agent.yaml
      - ./tests/e2e/data:/app/helvillette/othela/data
    networks:
      - helvilette-net
    depends_on:
      - othela
      - git-server
    restart: unless-stopped

  git-server:
    image: gitea/gitea:1.21.11
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__DOMAIN=git-server
      - GITEA__server__SSH_DOMAIN=git-server
      - GITEA__server__ROOT_URL=http://git-server:3000/
    volumes:
      - ./data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    networks:
      - helvilette-net
    restart: unless-stopped

  # Wait for Gitea to be fully ready, create user, create repo, and push
  git-seeder:
    image: alpine:3.19
    volumes:
      - ./tests/e2e/data/playbooks:/data/playbooks
      - ./tests/e2e/git-seed.sh:/seed/git-seed.sh
    networks:
      - helvilette-net
    depends_on:
      - git-server
    command: >
      /bin/sh -c "apk add --no-cache curl jq git && chmod +x /seed/git-seed.sh && /seed/git-seed.sh"

networks:
  helvilette-net:
    driver: bridge