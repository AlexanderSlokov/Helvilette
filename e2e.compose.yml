# The Helvilette end-to-end stack.
# 
# `make up` and `make e2e` now both run this file: the Ginkgo suite brings it up with
# `docker compose` rather than restating the topology in Go. Othela and the agents 
# run under systemd as PID 1, as real units, because that is the layer Helvilette manages.

name: helvilette-e2e

# What systemd as PID 1 needs in a container, extended by each node service.:
#
#   cgroup: host        Without it this daemon does not present a cgroup2
#                       filesystem at /sys/fs/cgroup inside the container, and
#                       systemd falls back to its legacy hierarchy and dies
#                       trying to mount /sys/fs/cgroup/systemd.
# 
#   the cgroup bind     systemd creates an init.scope under its own scope 
#                       and fails with "Read-only file system".
# 
#   tmpfs on /run        systemd writes its runtime state there.
# 
#   SYS_ADMIN            Mounting its API filesystems.
# 
#   seccomp/apparmor     See the note on security_opt below.
# 
#   SIGRTMIN+3           systemd's shutdown signal; SIGTERM means "reexec" to it,
#                       so `docker stop` would hang until the kill timeout.

networks:
  helvilette:
    driver: bridge

x-systemd-node: &systemd-node
  build:
    context: .
    dockerfile: tests/images/node/Dockerfile
  cgroup: host
  tmpfs:
    - /run
    - /run/lock
    - /tmp
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  # CAP_SYS_ADMIN lets systemd mount its own API filesystems; 
  # CAP_SYS_TIME lets the baseline playbook start chrony, 
  # which is the point of managing a real service.
  cap_add:
    - SYS_ADMIN
    - SYS_TIME
  # systemd forks a sandbox to run its generators, 
  # it fails with "Failed to fork off sandboxing environment for
  # executing generators: Protocol error" and PID 1 exits 255.
  # (The default seccomp profile refuses.) Unconfining these two:
  security_opt:
    - seccomp=unconfined
    - apparmor=unconfined
  stop_signal: SIGRTMIN+3
  stop_grace_period: 20s
  networks:
    - helvilette
  restart: unless-stopped

services:
  # Serves three repositories:
  #   fleet             the manifests Othela reads, one per subdirectory
  #   nginx-collection  the playbook the edge-proxy group runs
  #   baseline          the playbook the baseline group runs
  git-server:
    build:
      context: .
      dockerfile: tests/images/gitserver/Dockerfile
    image: helvilette-gitserver:e2e
    networks:
      - helvilette
    # Published for convenience only; every service reaches it over the compose
    # network.
    ports:
      - "${HELV_GIT_PORT:-9418}:9418"
    restart: unless-stopped

  othela:
    <<: *systemd-node
    build:
      context: .
      dockerfile: tests/images/node/Dockerfile
      target: othela-node
    image: helvilette-othela-node:e2e
    hostname: othela
    # The suite reads HELV_OTHELA_PORT with the same default, so overriding it
    # moves both.
    ports:
      - "${HELV_OTHELA_PORT:-8080}:8080"
    depends_on:
      git-server:
        condition: service_healthy
    # curl -f fails on a non-2xx, so an Othela that is draining and answering
    # /readyz with 503 reports unhealthy. A bare TCP probe would call it healthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 20

  node-1:
    <<: *systemd-node
    build:
      context: .
      dockerfile: tests/images/node/Dockerfile
      target: agent-node
    image: helvilette-agent-node:e2e
    hostname: node-1
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./tests/images/node/agent-node-1.env:/etc/helvilette/agent.env:ro
    depends_on:
      othela:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "systemctl", "is-active", "--quiet", "helvilette-agent.service"]
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 20

