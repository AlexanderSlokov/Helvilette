name: Othela CI

on:
  push:
    branches:
      - main
      - develop
      - 'releases/*'
      - 'v*.*.*-rc*'
  pull_request:
    branches:
      - main
      - develop
      - 'releases/*'
      - 'v*.*.*-rc*'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain (CGO for go-sqlite3)
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Download dependencies
        run: go mod download

      # Runs before the slower steps so a formatting-only failure reports fast.
      # Shares the Makefile target so CI and local runs cannot disagree.
      - name: Format check
        run: make fmt-check

      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "1"

      # Covers ./cmd/... and ./pkg/... in one step. The previous split ran
      # ./cmd/othela/... and ./pkg/... separately, which silently left
      # ./cmd/agent/... untested, and repeated ./pkg/storage/... twice.
      - name: Unit tests
        run: go test ./cmd/... ./pkg/... -v -count=1
        env:
          CGO_ENABLED: "1"

      # The fleet sync goroutine and the HTTP handlers share Server.loader and
      # Loader.playbooks. Two races lived there undetected because CI never ran
      # with -race; concurrent map access panics, so this is not theoretical.
      # See issue #38.
      - name: Race detector
        run: go test -race ./cmd/... ./pkg/... -count=1
        env:
          CGO_ENABLED: "1"

      - name: Build Othela binary
        run: go build -o bin/othela ./cmd/othela
        env:
          CGO_ENABLED: "1"

      - name: Build Agent binary
        run: go build -o bin/agent ./cmd/agent
        env:
          CGO_ENABLED: "1"

  # The distributable images have no consumer inside this repository: the e2e
  # stack builds its own systemd node images instead. Without this job they would
  # drift out of buildability unnoticed, which is exactly how the Vagrant
  # environment died. See ADR-0007.
  images:
    name: Distributable Images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: make images

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The stack runs systemd as PID 1 in each node container, which needs a
      # cgroup v2 host. ubuntu-latest runners are cgroup v2; asserting it here
      # turns a confusing systemd boot failure into a one-line diagnosis.
      - name: Assert cgroup v2
        run: |
          fstype=$(stat -fc %T /sys/fs/cgroup/)
          echo "cgroup filesystem: $fstype"
          test "$fstype" = "cgroup2fs"

      - name: Run E2E Tests
        run: make e2e

      # The suite asserts on journald inside the nodes, so a failure is usually
      # only explicable from what the units logged.
      - name: Journals on failure
        if: failure()
        run: |
          for node in othela node-1 node-2; do
            echo "::group::journal $node"
            docker compose -f e2e.compose.yml exec -T "$node" \
              journalctl --no-pager -t 'helvilette*' || true
            echo "::endgroup::"
          done
          echo "::group::compose ps"
          docker compose -f e2e.compose.yml ps || true
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: make clean-e2e
